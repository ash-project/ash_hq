[[stages]]
id = "encryption"
name = "Encryption"
module = "MyApp.Blog.Post"
description = "Add encryption at rest with our Cloak integration. Your post content is now automatically encrypted when stored and decrypted when read, with no changes to your existing API or business logic. The encryption is completely transparent to your application code."
highlight = "3-13"
code = '''
defmodule MyApp.Blog.Post do
  use Ash.Resource
    extensions: [
      AshGraphql.Resource,
      AshJsonApi.Resource,
      AshCloak.Resource
    ]

  cloak do
    vault MyApp.Vault
    # Automatically encrypt content
    attributes [:content]
  end
  # ...
end
'''

