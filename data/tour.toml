}
'''

[[stages]]
id = "json-api"
name = "JSON:API"
module = "MyApp.Blog.Post"
description = "Add a REST JSON:API alongside your GraphQL API. All API extensions work on top of your resources and actions. Ash makes it trivial to expose your domain through multiple API standards, letting clients choose the interface that works best for them."
highlight = "3-18"
code = '''
defmodule MyApp.Blog.Post do
  use Ash.Resource
    extensions: [
      AshGraphql.Resource,
      AshJsonApi.Resource
    ]

  json_api do
    type "post"

    routes do
      base "/posts"
      get :read
      index :read
      post :create
      patch :update
    end
  end
  # ...
end
'''

