[[stages]]
id = "ai-tools"
name = "AI Tools"
module = "MyApp.Blog.Post"
description = "Add AI-powered actions and expose your domain as tools for LLMs. Ash AI lets you create prompt-backed actions that delegate to AI models, and exposes your existing actions as tools that AI agents can use. Perfect for building AI-powered features or MCP (Model Context Protocol) servers."
highlight = "3-24"
code = '''
defmodule MyApp.Blog.Post do
  use Ash.Resource
    extensions: [
      #...,
      AshAi
    ]

  actions do
    # AI-powered action
    action :analyze_sentiment, :atom do
      constraints [
        one_of: [:positive, :negative]
      ]

      argument :content, :string,
        allow_nil?: false

      run prompt(
        ChatOpenAI.new!(
          %{model: "gpt-4o"}
        )
      )
    end
  end
  #...
end
'''

