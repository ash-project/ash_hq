kind = "table"
head = ["Column", "Type"]
rows = [["id", "uuid"], ["title", "text"], ["content", "text"], ["status", "text"], ["created_at", "timestamp"], ["updated_at", "timestamp"]]

[[stages]]
id = "graphql"
name = "GraphQL"
module = "MyApp.Blog.Post"
description = "Add a full GraphQL API with minimal configuration. The extension automatically understands your existing actions and generates queries, mutations, and types."
highlight = "3-18"
code = '''
defmodule MyApp.Blog.Post do
  use Ash.Resource
    extensions: [AshGraphql.Resource]

  graphql do
    type :post

    queries do
      get :post, :read
      list :posts, :read
    end

    mutations do
      create :create_post, :create
      update :update_post, :update
      destroy :delete_post, :destroy
    end
  end
  # ...
end
'''

[stages.panel]
title = "GraphQL API"
icon = "share-2"

[[stages.panel.blocks]]
kind = "code"
label = "Query"
language = "graphql"
code = '''
query GetPost($id: ID!) {
  post(id: $id) {
    id
    title
  }
}
'''

[[stages.panel.blocks]]
