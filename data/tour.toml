[[stages]]
id = "policies"
name = "Policies"
module = "MyApp.Support.Ticket"
description = "Add fine-grained authorization with policies. Control who can perform which actions and which data they can see. Policies can forbid actions or filter data transparently for reads, preventing enumeration attacks."
highlight = "3 5-22"
code = '''
defmodule MyApp.Support.Ticket do
  use Ash.Resource
    extensions: [
      # ...
    ],
    authorizers: [Ash.Policy.Authorizer]

  policies do
    # Only admins can create tickets
    policy action_type(:create) do
      authorize_if expr(
        ^actor(:role) == :admin
      )
    end

    # Users can only read their own tickets
    policy action_type(:read) do
      authorize_if expr(
        user_id == ^actor(:id)
      )
    end
  end
  # ...
end
'''

