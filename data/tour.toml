[[stages]]
id = "background-jobs"
name = "Background Jobs"
module = "MyApp.Blog.Post"
description = "Add background job processing with AshOban. Define triggers that run periodically for records matching conditions, and scheduled actions that run on cron schedules. Perfect for notifications, data processing, and maintenance tasks."
highlight = "3 5-19"
code = '''
defmodule MyApp.Blog.Post do
  use Ash.Resource
    extensions: [
      # ...
      AshOban
    ]

  oban do
    triggers do
      trigger :publish do
        where expr(state == :pending)
        scheduler_cron "@hourly"
      end
    end
    scheduled_actions do
      schedule :cleanup_old_drafts,
        "@daily"
    end
  end
  # ...
end
'''

