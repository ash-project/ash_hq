# The home page's feature tour: one resource, built up stage by stage.
#
# name, module, description and code are from the live site's tour (AshAnimation.stages in the
# Phoenix app's app.js); code shows the whole resource, as the live tour did. The highlighted
# lines and result panels follow the design.
#
# id:        the stage's slug, used in the page's URL hash
# highlight: line ranges added in this stage, 1-based, as Zola's hl_lines takes them
# panel:     what the stage gives you. Each block has a kind:
#            code (label, language, code), pairs (items: [label, value]), table (head, rows),
#            endpoints (items: [method, path]), chips (label, icon, mono, items), flow (from, to:
#            [label, value]), note (text), jobs (items: [title, description, name, schedule]),
#            link (label, href)

[[stages]]
id = "resources-actions"
name = "Resources & Actions"
module = "MyApp.Blog.Post"
description = "Resources & Actions are the core abstraction in Ash. Actions are fully typed and introspectable (your application can examine them at runtime). This means extensions can automatically understand and build on top of them."
highlight = "3-17"
code = '''
defmodule MyApp.Blog.Post do
  use Ash.Resource
  actions do
    action :reading_time, :integer do
      argument :content, :string,
        allow_nil?: false

      run fn input, _ ->
        words =
          input.arguments.content
          |> String.split()
          |> length()

        {:ok, div(words, 200) + 1}
      end
    end
  end
end
'''

[stages.panel]
title = "Functional Interface"
icon = "braces"

[[stages.panel.blocks]]
kind = "code"
code = '''
MyApp.Blog.Post.reading_time("content string")
'''

[[stages.panel.blocks]]
kind = "pairs"
items = [["Takes:", "content: String"], ["Returns:", "Integer (minutes)"]]

[[stages.panel.blocks]]
kind = "code"
label = "Example:"
code = '''
reading_time("A long blog post...") → 3
'''

[[stages]]
id = "persistence"
name = "Persistence"
module = "MyApp.Blog.Post"
description = "Now let's add state to support persistent storage, while keeping our existing behavior. Your resource now combines behavior and state. The original action still works exactly the same, plus you can create and persist posts."
highlight = "3-21"
code = '''
defmodule MyApp.Blog.Post do
  use Ash.Resource
    data_layer: AshPostgres.DataLayer

  postgres do
    table "posts"
    repo MyApp.Repo
  end

  attributes do
    uuid_primary_key :id
    attribute :title, :string,
      allow_nil?: false
    attribute :content, :string
    attribute :status, :atom,
      constraints: [
        one_of: [:draft, :published]
      ]

    timestamps()
  end
  # ...
end
'''

