# Events: talks, trainings and conferences with the Ash team.
#
# Upcoming events are listed on the Community page, and the next one is shown in a bar above the
# header on every page. Past events are left out when the site is built, so there's no need to
# remove them: the scheduled rebuilds keep the list current.
#
# date:         the first day, as YYYY-MM-DD
# end_date:     the last day, for events over several days (optional)
# date_label:   how the date is shown; defaults to the first day, e.g. "3 October 2026" (optional)
# title, href:  the event's name and page
# subtitle:     a talk or session title, or a one-line summary (HTML is allowed)
# description:  a sentence or two about it
# type:         e.g. "Talk", "Training", "Conference" (optional)
# location:     e.g. "Varberg, Sweden" (optional)
# cta:          the link's text (optional, defaults to "Details")
#
# Ported from the Phoenix app's lib/ash_hq/events.ex, with each description's two paragraphs as
# the subtitle and description.

