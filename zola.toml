# The URL the site will be built for
base_url = "https://ash-hq.org"
title = "Ash Framework"
description = "Model your domain, derive the rest."
default_language = "en"

# Sass only bundles the plain CSS partials in sass/ into one stylesheet, /site.css
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

generate_feeds = true
feed_filenames = ["atom.xml"]

# Tags are shown on posts but don't get pages of their own (yet)
taxonomies = [{ name = "tags", render = false }]

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
# Put all your custom variables here
og_image = "https://ash-hq.org/images/ash-logo-side.png"
