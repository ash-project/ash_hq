# The URL the site will be built for
base_url = "https://ash-hq.org"
title = "Ash Framework"
description = "Model your domain, derive the rest."
default_language = "en"

# Sass only bundles the plain CSS partials in sass/ into one stylesheet, /site.css
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

generate_feeds = true
feed_filenames = ["atom.xml"]

# Tags are shown on posts but don't get pages of their own (yet)
taxonomies = [{ name = "tags", render = false }]

[markdown]

[markdown.highlighting]
# The design system's syntax colours, as CSS classes in a generated /giallo.css. `zola serve`
# doesn't watch highlighting/, so restart it after changing the theme.
theme = "ash"
extra_themes = ["highlighting/ash.json"]
# ```iex code blocks: IEx sessions, with the prompt muted
extra_grammars = ["highlighting/iex.json"]
style = "class"

[extra]
og_image = "https://ash-hq.org/images/ash-logo-side.png"
github = "https://github.com/ash-project/ash"
premium_support = "https://alembic.com.au/services/ash-framework-premium-support"
discord = "https://discord.gg/D7FNG2q"

# Blog authors' GitHub usernames, for their avatars
[extra.authors]
"Zach Daniel" = "zachdaniel"

# The main navigation. `path` links within the site (and marks the current section), `url` links
# elsewhere.
[[extra.nav]]
label = "Docs"
url = "https://hexdocs.pm/ash"

[[extra.nav]]
label = "Installer"
path = "/installer/"

[[extra.nav]]
label = "Ecosystem"
path = "/ecosystem/"

[[extra.nav]]
label = "Community"
path = "/community/"

[[extra.nav]]
label = "Media"
path = "/media/"

[[extra.nav]]
label = "Blog"
path = "/blog/"
