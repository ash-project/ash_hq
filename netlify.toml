# Each deploy is built for its own address, as Zola writes absolute URLs, so links and assets on
# test and preview deploys stay on that deploy:
# - production deploys use the site's main address (URL, set by Netlify)
# - deploy previews and branch deploys use theirs (DEPLOY_PRIME_URL, set by Netlify)
# - ZOLA_BASE_URL overrides both: `/` gives root-relative URLs, for draft deploys, whose address
#   isn't known until they're uploaded
#
# The contributors are optional: without them, the Community page leaves out its avatar wall. Set
# GITHUB_TOKEN in the site's environment variables to avoid GitHub's rate limit for anonymous
# requests, which Netlify's shared build servers can hit.

[build]
command = "(sh scripts/fetch-contributors.sh || echo 'Skipping contributors') && zola build --base-url \"${ZOLA_BASE_URL:-${URL:-https://ash-hq.org}}\""
publish = "public"

[context.deploy-preview]
command = "(sh scripts/fetch-contributors.sh || echo 'Skipping contributors') && zola build --base-url \"${ZOLA_BASE_URL:-${DEPLOY_PRIME_URL:-https://ash-hq.org}}\""

[context.branch-deploy]
command = "(sh scripts/fetch-contributors.sh || echo 'Skipping contributors') && zola build --base-url \"${ZOLA_BASE_URL:-${DEPLOY_PRIME_URL:-https://ash-hq.org}}\""

[build.environment]
ZOLA_VERSION = "0.23.6"

# Edge functions, in netlify/edge-functions/, declare their own paths:
# - installer.js: the installer scripts at /new/:name and /install/:name
# - docs-redirect.js: the old docs URLs under /docs, to hexdocs

# The feed used to be at /rss
[[redirects]]
from = "/rss"
to = "/atom.xml"
status = 301

# An old slug of the 2.0 post. /blog/testing is a Zola alias, but one differing only by case
# would collide with it on case-insensitive filesystems.
[[redirects]]
from = "/blog/Testing"
to = "/blog/ash-framework-2-0-release/"
status = 301

# The old archive of Discord forum threads, which has been broken for a while
[[redirects]]
from = "/forum/*"
to = "/community/"
status = 301

[[redirects]]
from = "/forum"
to = "/community/"
status = 301
