{# The bar above the header, for the next upcoming event (`upcoming_events`, set in base.html) #}
{%- if upcoming_events | length > 0 %}
  {%- set next_event = upcoming_events | first %}
  {{ <ui.event_bar title={next_event.title} date={next_event.date_label | default(value=next_event.date | date(format="%-d %B %Y"))} href={next_event.href} location={next_event.location | default(value="")} cta={next_event.cta | default(value="Details")} /> }}
{%- endif %}
